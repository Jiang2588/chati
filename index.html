<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2eee5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2317140f'/%3E%3Cpath d='M16 22h32M16 32h32M16 42h20' stroke='%23f2eee5' stroke-width='3'/%3E%3C/svg%3E">
<title>拆题 · 教材题库</title>
<meta name="description" content="导入教材和课件，自动拆成题目。公共题库、私人题库，下一步、看答案。">
<style>
:root{
  --paper:#f2eee5;
  --paper-2:#eae4d8;
  --ink:#17140f;
  --ink-2:#2e2921;
  --muted:#7c7466;
  --line:#d5ccbd;
  --line-2:#bcb1a0;
  --accent:#b13a22;
  --accent-soft:#f0d9cf;
  --green:#2e6349;
  --white:#fbf8f1;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.45;
  background-image:radial-gradient(rgba(23,20,15,.06) .7px, transparent .8px);
  background-size:3px 3px;mix-blend-mode:multiply;
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--accent);color:var(--white)}
.shell{max-width:1140px;margin:0 auto;padding:0 30px 90px}
body.focus .masthead,body.focus .tabs{display:none}
body.focus .shell{padding-top:0}
.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;gap:30px;
  padding:36px 0 20px;border-bottom:1.5px solid var(--ink);
}
.brand{display:flex;align-items:flex-end;gap:18px;min-width:0}
.brand h1{
  font-family:var(--serif);font-weight:600;font-size:clamp(42px,7vw,78px);
  line-height:.88;letter-spacing:.06em;margin:0;
}
.brand .en{
  writing-mode:vertical-rl;font-size:10px;letter-spacing:.32em;color:var(--muted);
  padding-bottom:6px;text-transform:uppercase;white-space:nowrap;
}
.mast-note{text-align:right;font-size:12px;color:var(--muted);line-height:1.9;max-width:290px}
.mast-note b{color:var(--ink);font-weight:500}
.mast-note .formats{display:inline-flex;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);
  padding:2px 7px;font-size:10px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase;
}
.tabs{display:flex;gap:26px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;background:var(--paper)}
.tabs .inner{max-width:1140px;margin:0 auto;padding:0 30px;display:flex;gap:26px;align-items:center;width:100%}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;padding:15px 0 13px;
  font-size:12px;letter-spacing:.16em;color:var(--muted);
}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tabs .spacer{flex:1}
.tabs .mini{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.stat{padding:20px 0 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.stat b{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;letter-spacing:.02em}
.stat b em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px;letter-spacing:0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:38px 0 10px}
.section-head h2{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.04em;margin:0}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.section-head .note{font-size:12px;color:var(--muted)}
.bank-list{border-top:1.5px solid var(--ink)}
.bank{
  display:grid;grid-template-columns:58px 1fr 150px;gap:22px;align-items:center;
  padding:22px 0 20px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;
  transition:background .2s ease,padding .2s ease;
}
.bank:hover{background:rgba(177,58,34,.035);padding-left:8px;padding-right:8px}
.bank .no{font-family:var(--serif);font-size:32px;color:var(--line-2);line-height:1;letter-spacing:.02em}
.bank:hover .no{color:var(--accent)}
.bank h3{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.35;margin:0 0 6px;letter-spacing:.02em}
.bank .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.bank .meta span{position:relative}
.bank .meta span+span::before{content:"/";position:absolute;left:-9px;color:var(--line-2)}
.bank .desc{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bank .right{text-align:right}
.bank .right b{display:block;font-family:var(--serif);font-size:24px;line-height:1;font-weight:600}
.bank .right span{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.bar{height:2px;background:var(--line);margin-top:9px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.empty{
  padding:70px 0 60px;text-align:center;border-bottom:1px solid var(--line);
}
.empty .big{font-family:var(--serif);font-size:34px;color:var(--line-2);line-height:1.2;margin-bottom:12px}
.empty p{color:var(--muted);font-size:13px;max-width:420px;margin:0 auto 22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:11px 20px;font-size:12px;letter-spacing:.12em;text-decoration:none;
  transition:background .18s,color .18s,border-color .18s;border-radius:1px;
}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:7px 12px;font-size:11px;letter-spacing:.08em}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.link{background:none;border:0;border-bottom:1px solid var(--ink);padding:0 0 1px;font-size:12px;color:var(--ink)}
.link:hover{color:var(--accent);border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.segmented{display:inline-flex;border:1px solid var(--line-2)}
.segmented button{border:0;background:transparent;padding:7px 13px;font-size:11px;letter-spacing:.08em;border-right:1px solid var(--line-2)}
.segmented button:last-child{border-right:0}
.segmented button.on{background:var(--ink);color:var(--paper)}
.quiz{max-width:880px;margin:0 auto}
.quizbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 16px;border-bottom:1px solid var(--line)}
.quizbar .left{display:flex;align-items:center;gap:14px;min-width:0}
.quizbar .title{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-track{flex:1;height:2px;background:var(--line);margin:0 6px;position:relative}
.progress-track i{position:absolute;left:0;top:0;height:100%;background:var(--ink);width:0}
.counter{font-family:var(--serif);font-size:13px;letter-spacing:.08em;white-space:nowrap}
.counter b{font-size:19px;font-weight:600}
.qcard{padding:34px 0 90px;min-height:44vh}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.qmeta .accent{color:var(--accent)}
.tag{border:1px solid var(--line-2);padding:2px 7px;font-size:10px;letter-spacing:.06em}
.stem{
  font-family:var(--serif);font-size:clamp(21px,2.9vw,30px);line-height:1.72;
  letter-spacing:.01em;margin:18px 0 0;white-space:pre-wrap;word-break:break-word;
}
.stem.small{font-size:clamp(18px,2.2vw,23px);line-height:1.9}
.options{display:grid;gap:10px;margin-top:26px}
.option{
  display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;
  text-align:left;background:transparent;border:1px solid var(--line);padding:14px 16px;
  font-size:16px;line-height:1.75;transition:border-color .15s,background .15s;
}
.option:hover{border-color:var(--ink);background:var(--white)}
.option .key{font-family:var(--serif);font-size:19px;color:var(--accent);text-align:center;line-height:1.6}
.option .txt{white-space:pre-wrap;word-break:break-word}
.option.picked{border-color:var(--ink);background:var(--white)}
.option.correct{border-color:var(--green);background:#eef3ee}
.option.correct .key{color:var(--green)}
.option.wrong{border-color:var(--accent);background:#f8eae5}
.answer-input{margin-top:26px}
.answer-input textarea{
  width:100%;min-height:88px;border:1px solid var(--line-2);background:var(--white);
  padding:13px 15px;font-size:15px;line-height:1.8;resize:vertical;outline:none;
  font-family:var(--serif);color:var(--ink);
}
.answer-input textarea:focus{border-color:var(--accent)}
.answer-input textarea::placeholder{font-family:var(--sans);font-size:12px;color:var(--muted)}
.answer-input .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}
.answer-input .row span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.judge{
  margin-top:26px;border:1px solid var(--line-2);padding:14px 16px;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-size:13px;line-height:1.8;
}
.judge b{font-family:var(--serif);font-size:18px;font-weight:600}
.judge.right{border-color:var(--green);background:#eef3ee}
.judge.right b{color:var(--green)}
.judge.wrong{border-color:var(--accent);background:#f8eae5}
.judge.wrong b{color:var(--accent)}
.judge .self{margin-left:auto}
.answer{margin-top:30px;border-top:1.5px solid var(--ink);padding-top:18px;animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.answer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.answer-head h4{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
.answer-val{font-family:var(--serif);font-size:19px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.answer-val.empty{color:var(--muted);font-size:14px;font-family:var(--sans)}
.expl{
  margin-top:18px;padding-left:16px;border-left:2px solid var(--accent);
  font-size:14px;line-height:2;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
}
.expl .h{display:block;font-size:10px;letter-spacing:.16em;color:var(--accent);margin-bottom:6px;text-transform:uppercase}
.qactions{
  position:sticky;bottom:0;z-index:20;background:var(--paper);
  border-top:1px solid var(--line);padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.qactions .side{display:flex;gap:8px;align-items:center}
.qactions .main{display:flex;gap:8px;align-items:center}
.icon-btn{border:0;background:none;padding:8px 4px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.icon-btn.on{color:var(--accent)}
.icon-btn:hover{color:var(--ink)}
.finish{padding:50px 0;text-align:center}
.finish .big{font-family:var(--serif);font-size:clamp(34px,6vw,60px);line-height:1.1;letter-spacing:.04em}
.finish .sub{color:var(--muted);font-size:13px;margin-top:12px}
.finish .grid{display:grid;grid-template-columns:repeat(3,1fr);max-width:520px;margin:34px auto 26px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.finish .grid div{padding:18px 0;border-right:1px solid var(--line)}
.finish .grid div:last-child{border:0}
.finish .grid b{display:block;font-family:var(--serif);font-size:32px;line-height:1}
.finish .grid span{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.drop{
  border:1.5px dashed var(--line-2);padding:52px 24px;text-align:center;background:rgba(255,255,255,.18);
  transition:background .2s,border-color .2s;
}
.drop.hot{background:var(--white);border-color:var(--accent)}
.drop .mark{font-family:var(--serif);font-size:44px;color:var(--line-2);line-height:1}
.drop h3{font-family:var(--serif);font-size:23px;margin:14px 0 8px;font-weight:600}
.drop p{color:var(--muted);font-size:12px;margin:0 0 18px}
.progress{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.progress .track{flex:1;height:2px;background:var(--line);position:relative}
.progress .track i{position:absolute;left:0;top:0;height:100%;background:var(--accent);width:0}
.paste-box{border-top:1px solid var(--line);margin-top:24px;padding-top:18px}
.paste-box textarea{
  width:100%;min-height:104px;border:1px solid var(--line-2);background:var(--white);
  padding:12px 14px;font-size:13px;line-height:1.8;resize:vertical;outline:none;font-family:var(--sans);
}
.paste-box textarea:focus{border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin-top:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:8px 0;
  font-size:15px;outline:none;border-radius:0;
}
.field input:focus,.field select:focus{border-bottom-color:var(--accent)}
.field.wide{grid-column:1/-1}
.preview{border-top:1.5px solid var(--ink);margin-top:38px}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.preview-head .count{font-size:12px;color:var(--muted)}
.preview-list{max-height:58vh;overflow:auto}
.pitem{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pitem:hover{background:rgba(177,58,34,.03)}
.pitem input{margin-top:5px;accent-color:var(--accent);width:15px;height:15px}
.pitem .no{font-family:var(--serif);font-size:12px;color:var(--muted)}
.pitem .txt{font-size:13px;line-height:1.7;color:var(--ink-2);max-height:3.4em;overflow:hidden}
.pitem .badge{font-size:9px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);padding:1px 5px;white-space:nowrap;align-self:center}
.pitem .badge.ans{color:var(--green);border-color:#b9cebe}
.settings-block{border-top:1px solid var(--line);padding:24px 0}
.settings-block h3{font-family:var(--serif);font-size:18px;margin:0 0 6px;font-weight:600}
.settings-block p{font-size:12px;color:var(--muted);margin:0 0 14px;max-width:640px}
.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inline-form input{flex:1;min-width:220px;border:1px solid var(--line-2);background:var(--white);padding:9px 11px;font-size:13px;outline:none}
.inline-form input:focus{border-color:var(--accent)}
.hint{font-size:11px;color:var(--muted);line-height:1.8}
.modal-bg{position:fixed;inset:0;background:rgba(23,20,15,.52);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(720px,100%);background:var(--paper);padding:30px 30px calc(26px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.7,.2,1) both;border-top:3px solid var(--accent);
}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
.sheet-head h3{font-family:var(--serif);font-size:26px;line-height:1.3;margin:8px 0 0;font-weight:600}
.sheet-close{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:0}
.chapter-chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0}
.chapter-chips button{
  border:1px solid var(--line-2);background:transparent;padding:5px 10px;font-size:11px;letter-spacing:.04em;color:var(--muted);
}
.chapter-chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sheet-row{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start;margin-top:24px}
.sheet-row .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:8px}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 16px;font-size:12px;letter-spacing:.06em;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{border:1px solid var(--accent);color:var(--accent);padding:10px 12px;font-size:12px;margin-top:14px;background:rgba(177,58,34,.04)}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){
  .shell{padding:0 18px 84px}
  .tabs .inner{padding:0 18px;gap:20px}
  .masthead{padding:26px 0 16px}
  .mast-note{display:none}
  .brand .en{font-size:9px}
  .summary{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}
  .bank{grid-template-columns:40px 1fr 88px;gap:14px;padding:18px 0}
  .bank .no{font-size:24px}
  .bank h3{font-size:17px}
  .bank .right b{font-size:20px}
  .qcard{padding-top:26px;padding-bottom:132px}
  .qactions{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:820px;
    flex-wrap:wrap;flex-direction:column;align-items:stretch;gap:6px;
    padding:9px 18px calc(10px + env(safe-area-inset-bottom));background:var(--paper);z-index:60;
  }
  .qactions .side{width:100%;justify-content:flex-start}
  .qactions .side:first-child{border-bottom:1px solid var(--line);padding-bottom:5px}
  .qactions .main{width:100%}
  .qactions .main .btn{flex:1}
  .qactions .icon-btn{padding:4px 2px}
  .form-grid{grid-template-columns:1fr}
  .sheet{padding:24px 18px calc(22px + env(safe-area-inset-bottom))}
  .sheet-row{grid-template-columns:1fr;gap:6px}
  .finish .grid{max-width:100%}
  .option{grid-template-columns:34px 1fr;padding:12px 12px;font-size:15px}
}
@media (max-width:480px){
  .tabs .mini{display:none}
  .tabs{gap:18px}
  .masthead{gap:10px}
  .brand h1{font-size:48px}
  .bank .meta span{font-size:10px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <h1>拆题</h1>
      <div class="en">Question Splitter</div>
    </div>
    <div class="mast-note">
      <b>教材、课件、试卷，拆成一题一页。</b><br>
      导入 PDF 或 Word，自动切题。下一步、看答案，或者整章过一遍。
      <div class="formats"><span class="chip">PDF</span><span class="chip">DOCX</span><span class="chip">离线可用</span></div>
    </div>
  </header>

  <nav class="tabs">
    <div class="inner">
      <button class="tab active" data-nav="library">题库</button>
      <button class="tab" data-nav="import">导入</button>
      <button class="tab" data-nav="settings">设置</button>
      <span class="spacer"></span>
      <span class="mini" id="repoMini">公共题库来自你自己的教材</span>
    </div>
  </nav>

  <main id="app"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------- storage
  const PROG_KEY="chati.progress.v1";
  const SET_KEY="chati.settings.v1";
  const BANK_KEY="chati.private.v1";

  const readJSON=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
  const writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

  let progress=readJSON(PROG_KEY,{});
  let settings=readJSON(SET_KEY,{repo:"Jiang2588/chati",token:""});

  function prog(id){
    if(!progress[id]) progress[id]={seen:[],wrong:[],marked:[],last:0};
    const p=progress[id];
    p.seen=p.seen||[];p.wrong=p.wrong||[];p.marked=p.marked||[];
    return p;
  }
  function saveProg(){writeJSON(PROG_KEY,progress)}

  // IndexedDB bank store (falls back to localStorage)
  let dbPromise=null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise=new Promise(resolve=>{
      try{
        const req=indexedDB.open("chati-banks",1);
        req.onupgradeneeded=()=>{req.result.createObjectStore("banks",{keyPath:"id"})};
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>resolve(null);
      }catch(e){resolve(null)}
    });
    return dbPromise;
  }
  async function bankAll(){
    const db=await openDB();
    if(db){
      return new Promise(resolve=>{
        const tx=db.transaction("banks","readonly").objectStore("banks").getAll();
        tx.onsuccess=()=>resolve(tx.result||[]);
        tx.onerror=()=>resolve(readJSON(BANK_KEY,[]));
      });
    }
    return readJSON(BANK_KEY,[]);
  }
  async function bankPut(bank){
    const db=await openDB();
    if(db){
      return new Promise(resolve=>{
        const tx=db.transaction("banks","readwrite");
        tx.objectStore("banks").put(bank);
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>resolve(false);
      });
    }
    const all=readJSON(BANK_KEY,[]).filter(b=>b.id!==bank.id);
    all.push(bank);writeJSON(BANK_KEY,all);return true;
  }
  async function bankDel(id){
    const db=await openDB();
    if(db){
      return new Promise(resolve=>{
        const tx=db.transaction("banks","readwrite");
        tx.objectStore("banks").delete(id);
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>resolve(false);
      });
    }
    writeJSON(BANK_KEY,readJSON(BANK_KEY,[]).filter(b=>b.id!==id));return true;
  }

  // ---------------------------------------------------------------- state
  const state={
    view:"library",
    tab:"public",
    manifest:[],
    privates:[],
    loading:true,
    bank:null,
    session:null,
    import:{
      files:[], parsed:[], selected:new Set(), busy:false, progress:0, stage:"",
      title:"", subject:"高等数学", parsedFileName:""
    }
  };

  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  const uid=()=>"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+"-";

  let toastTimer=null;
  function toast(msg){
    const el=$("#toast");el.textContent=msg;el.classList.add("on");
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("on"),2600);
  }

  function setNav(view){
    state.view=view;
    $$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.nav===view));
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  $$(".tab").forEach(t=>t.addEventListener("click",()=>setNav(t.dataset.nav)));

  // ---------------------------------------------------------------- public banks
  async function loadPublic(){
    try{
      const r=await fetch("banks/manifest.json",{cache:"no-cache"});
      if(!r.ok) throw new Error("no manifest");
      const data=await r.json();
      state.manifest=Array.isArray(data.banks)?data.banks:[];
    }catch(e){
      state.manifest=[];
    }
  }
  const publicCache={};
  async function loadBank(id){
    if(publicCache[id]) return publicCache[id];
    const item=state.manifest.find(b=>b.id===id);
    if(!item) throw new Error("找不到题库");
    const r=await fetch(item.file,{cache:"no-cache"});
    if(!r.ok) throw new Error("题库文件读取失败");
    const bank=await r.json();
    bank.visibility="public";
    publicCache[id]=bank;
    return bank;
  }

  // ---------------------------------------------------------------- library
  function renderLibrary(){
    const pcount=state.manifest.reduce((a,b)=>a+(b.count||0),0);
    const privTotal=state.privates.reduce((a,b)=>a+(b.questions?b.questions.length:0),0);
    const seenTotal=Object.values(progress).reduce((a,p)=>a+(p.seen?p.seen.length:0),0);
    const wrongTotal=Object.values(progress).reduce((a,p)=>a+(p.wrong?p.wrong.length:0),0);

    let list="";
    if(state.tab==="public"){
      list=state.manifest.map((b,i)=>bankRow(b,i+1,"public")).join("");
      if(!list) list=emptyBlock("公共题库还没载入","可能是本地打开的限制，或者清单文件还没生成。用导入页先建自己的题库。");
    }else{
      list=state.privates.map((b,i)=>bankRow(b,i+1,"private")).join("");
      if(!list) list=emptyBlock("你的题库是空的","把教材或课件拖进导入页，切出来的题目会存在这台设备里，不上传。");
    }

    $("#app").innerHTML=`
      <section class="summary">
        <div class="stat"><span>公共题</span><b>${fmt(pcount)}<em>题</em></b></div>
        <div class="stat"><span>私人题</span><b>${fmt(privTotal)}<em>题</em></b></div>
        <div class="stat"><span>已练</span><b>${fmt(seenTotal)}<em>题</em></b></div>
        <div class="stat"><span>错题</span><b>${fmt(wrongTotal)}<em>题</em></b></div>
      </section>
      <div class="section-head">
        <div>
          <div class="kicker">${state.tab==="public"?"Public banks":"Private banks"}</div>
          <h2>${state.tab==="public"?"公共题库":"我的题库"}</h2>
        </div>
        <div class="toolbar">
          <div class="segmented">
            <button data-tab="public" class="${state.tab==="public"?"on":""}">公共</button>
            <button data-tab="private" class="${state.tab==="private"?"on":""}">私人</button>
          </div>
          <button class="btn small" data-act="goto-import">导入教材</button>
        </div>
      </div>
      <div class="bank-list">${list}</div>
      <div class="toolbar" style="justify-content:space-between;margin-top:22px">
        <button class="link" data-act="submit-public">提交一份公共题库</button>
        <span class="hint">公共题库放在仓库里，私人题库只在这台设备。</span>
      </div>`;
    wireLibrary();
  }

  function bankRow(b,n,type){
    const count=b.count!=null?b.count:(b.questions?b.questions.length:0);
    const p=prog(b.id);
    const pct=count?Math.min(100,Math.round(p.seen.length/count*100)):0;
    const meta=[b.subject,b.source,fmt(count)+" 题"].filter(Boolean);
    return `<article class="bank" data-bank="${esc(b.id)}" data-vis="${type}">
      <div class="no">${String(n).padStart(2,"0")}</div>
      <div>
        <h3>${esc(b.title)}</h3>
        ${b.description?`<div class="desc">${esc(b.description)}</div>`:""}
        <div class="meta">${meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
      </div>
      <div class="right">
        <b>${pct}%</b><span>已练</span>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    </article>`;
  }

  function emptyBlock(title,text){
    return `<div class="empty"><div class="big">${esc(title)}</div><p>${esc(text)}</p><button class="btn" data-act="goto-import">去导入</button></div>`;
  }

  function wireLibrary(){
    $$("[data-tab]").forEach(b=>b.addEventListener("click",()=>{state.tab=b.dataset.tab;render()}));
    $$("[data-act='goto-import']").forEach(b=>b.addEventListener("click",()=>setNav("import")));
    $$("[data-act='submit-public']").forEach(b=>b.addEventListener("click",submitPublic));
    $$(".bank").forEach(el=>{
      el.addEventListener("click",()=>openBank(el.dataset.bank,el.dataset.vis));
    });
  }

  async function openBank(id,vis){
    try{
      let bank;
      if(vis==="public") bank=await loadBank(id);
      else bank=state.privates.find(b=>b.id===id);
      if(!bank) throw new Error("题库不存在");
      openStartSheet(bank);
    }catch(e){toast(e.message||"打开失败")}
  }

  // ---------------------------------------------------------------- start sheet
  function chaptersOf(bank){
    const arr=[];
    bank.questions.forEach(q=>{
      const c=q.chapter||"未分章";
      if(!arr.includes(c)) arr.push(c);
    });
    return arr;
  }

  function openStartSheet(bank){
    const chapters=chaptersOf(bank);
    const chosen=new Set(chapters);
    const p=prog(bank.id);
    const stateSheet={mode:"order",scope:"all",limit:0};
    const root=$("#modalRoot");
    root.innerHTML=`<div class="modal-bg"><div class="sheet">
      <div class="sheet-head">
        <div><div class="kicker">${bank.visibility==="private"?"私人题库":"公共题库"}</div><h3>${esc(bank.title)}</h3></div>
        <button class="sheet-close" data-close>&times;</button>
      </div>
      <div class="hint" style="margin-top:12px">${fmt(bank.questions.length)} 题 · ${esc(bank.subject||"")} ${bank.source?" · "+esc(bank.source):""}</div>
      <div class="sheet-row">
        <div class="label">章节</div>
        <div>
          <div class="chapter-chips" id="chapterChips">${chapters.map((c,i)=>`<button data-ch="${i}" class="on">${esc(c)}</button>`).join("")}</div>
          <div class="toolbar"><button class="link" id="chAll">全选</button><button class="link" id="chNone">全不选</button></div>
        </div>
      </div>
      <div class="sheet-row">
        <div class="label">方式</div>
        <div class="segmented" id="modeSeg">
          <button data-mode="order" class="on">顺序</button>
          <button data-mode="random">随机</button>
        </div>
      </div>
      <div class="sheet-row">
        <div class="label">范围</div>
        <div class="segmented" id="scopeSeg">
          <button data-scope="all" class="on">全部 ${bank.questions.length}</button>
          <button data-scope="unseen">未做 ${bank.questions.length-p.seen.length}</button>
          <button data-scope="wrong">错题 ${p.wrong.length}</button>
          <button data-scope="marked">收藏 ${p.marked.length}</button>
        </div>
      </div>
      <div class="sheet-row">
        <div class="label">题量</div>
        <div class="segmented" id="limitSeg">
          <button data-limit="0" class="on">不限</button>
          <button data-limit="20">20</button>
          <button data-limit="50">50</button>
          <button data-limit="100">100</button>
        </div>
      </div>
      <div class="toolbar" style="margin-top:30px">
        <button class="btn accent" id="startQuiz" style="flex:1;padding:14px 20px">开始</button>
        <button class="btn ghost" data-close>取消</button>
      </div>
      <div class="hint" id="sheetHint" style="margin-top:12px"></div>
    </div></div>`;
    const close=()=>{root.innerHTML=""};
    $$("[data-close]",root).forEach(b=>b.addEventListener("click",close));
    root.querySelector(".modal-bg").addEventListener("click",e=>{if(e.target.classList.contains("modal-bg"))close()});
    $$("#chapterChips button",root).forEach(b=>{
      b.addEventListener("click",()=>{
        const i=+b.dataset.ch;
        if(chosen.has(chapters[i]))chosen.delete(chapters[i]);else chosen.add(chapters[i]);
        b.classList.toggle("on",chosen.has(chapters[i]));
        updateHint();
      });
    });
    $("#chAll",root).onclick=()=>{chapters.forEach(c=>chosen.add(c));$$("#chapterChips button",root).forEach(b=>b.classList.add("on"));updateHint()};
    $("#chNone",root).onclick=()=>{chosen.clear();$$("#chapterChips button",root).forEach(b=>b.classList.remove("on"));updateHint()};
    $$("#modeSeg button",root).forEach(b=>b.onclick=()=>{
      stateSheet.mode=b.dataset.mode;$$("#modeSeg button",root).forEach(x=>x.classList.toggle("on",x===b));
    });
    $$("#scopeSeg button",root).forEach(b=>b.onclick=()=>{
      stateSheet.scope=b.dataset.scope;$$("#scopeSeg button",root).forEach(x=>x.classList.toggle("on",x===b));updateHint();
    });
    $$("#limitSeg button",root).forEach(b=>b.onclick=()=>{
      stateSheet.limit=+b.dataset.limit;$$("#limitSeg button",root).forEach(x=>x.classList.toggle("on",x===b));updateHint();
    });
    function pool(){
      let list=bank.questions.filter(q=>chosen.has(q.chapter||"未分章"));
      if(stateSheet.scope==="unseen") list=list.filter(q=>!p.seen.includes(q.id));
      if(stateSheet.scope==="wrong") list=list.filter(q=>p.wrong.includes(q.id));
      if(stateSheet.scope==="marked") list=list.filter(q=>p.marked.includes(q.id));
      return list;
    }
    function updateHint(){
      const n=pool().length;
      $("#sheetHint",root).textContent=n?`这次会练 ${n} 题${stateSheet.limit?`，取前 ${Math.min(n,stateSheet.limit)} 题`:""}`:"当前条件下没有题，换一个范围或章节。";
      $("#startQuiz",root).disabled=!n;
    }
    $("#startQuiz",root).onclick=()=>{
      let list=pool();
      if(stateSheet.mode==="random") list=shuffle(list);
      if(stateSheet.limit) list=list.slice(0,stateSheet.limit);
      if(!list.length) return;
      close();
      startQuiz(bank,list);
    };
    updateHint();
  }

  function shuffle(a){
    const b=a.slice();
    for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
    return b;
  }

  // ---------------------------------------------------------------- quiz
  function startQuiz(bank,list){
    state.session={
      bank, ids:list.map(q=>q.id), qs:list, idx:0, finished:false,
      picks:{}, status:{}, inputs:{}, peeks:{}, right:0, wrongN:0,
      startedAt:Date.now()
    };
    state.view="quiz";
    $$(".tab").forEach(t=>t.classList.toggle("active",false));
    render();
  }

  function renderQuiz(){
    const s=state.session;
    if(!s){setNav("library");return}
    if(s.finished){renderFinish();return}
    const q=s.qs[s.idx];
    const bank=s.bank;
    const p=prog(bank.id);
    const isMarked=p.marked.includes(q.id);
    const isWrong=p.wrong.includes(q.id);
    const answer=q.answer||"";
    const optionAnswer=/^[A-D]$/.test(answer.trim());
    const picked=(s.picks&&s.picks[q.id])||null;
    const result=(s.status&&s.status[q.id])||null;
    const revealed=!!result||!!(s.peeks&&s.peeks[q.id]);
    const typed=(s.inputs&&s.inputs[q.id])||"";
    const pct=Math.round((s.idx+1)/s.qs.length*100);
    const opts=(q.options||[]).map(o=>{
      let cls="";
      if(revealed){
        if(optionAnswer&&o.key===answer.trim()) cls="correct";
        else if(picked===o.key) cls="wrong";
      }else if(picked===o.key) cls="picked";
      return `<button class="option ${cls}" data-opt="${esc(o.key)}" ${revealed?"disabled":""}>
        <span class="key">${esc(o.key)}</span><span class="txt">${esc(o.text)}</span>
      </button>`;
    }).join("");
    const inputBox=(opts||q.type==="short")?"":`<div class="answer-input">
        <textarea data-input placeholder="把最终结果写在这里，提交后自动判对错。" ${revealed?"disabled":""}>${esc(typed)}</textarea>
        <div class="row">
          <button class="btn accent small" data-act="check" ${revealed?"disabled":""}>提交答案</button>
          <span>答案写法不同也算对：空格、全角符号、大小写不影响判定。</span>
        </div>
      </div>`;
    const judge=result?`<div class="judge ${result==="right"?"right":"wrong"}">
        <b>${result==="right"?"答对了":"答错了"}</b>
        <span>${result==="right"?"和参考答案一致。":"和参考答案不一致。先对照下面的答案，确认是自己算错还是答案写法和题解不同。"}</span>
        ${result==="wrong"?`<span class="self"><button class="link" data-act="self-right">其实我算对了</button></span>`:""}
      </div>`:"";
    const showAnswer=revealed?`
      <div class="answer">
        <div class="answer-head">
          <h4>Answer</h4>
          ${result?"":`<button class="link" data-act="hide-answer">收起</button>`}
        </div>
        ${answer?`<div class="answer-val">${esc(answer)}</div>`:`<div class="answer-val empty">这道题原书没有给答案。可以翻回教材对应章节，或者自己补一句写在错题本里。</div>`}
        ${q.explanation?`<div class="expl"><span class="h">解析</span>${esc(q.explanation)}</div>`:""}
      </div>`:"";
    const typeLabel={choice:"选择题",fill:"填空题",judge:"判断题",short:"解答题"}[q.type]||"题目";
    const sourceLine=[q.chapter,q.section].filter(Boolean)
      .filter(x=>!x.includes(typeLabel))
      .filter((x,i,a)=>a.indexOf(x)===i)
      .join(" · ");

    $("#app").innerHTML=`<section class="quiz">
      <div class="quizbar">
        <div class="left">
          <button class="link" data-act="back-library">题库</button>
          <span class="title">${esc(bank.title)}</span>
        </div>
        <div class="progress-track"><i style="width:${pct}%"></i></div>
        <div class="counter"><b>${String(s.idx+1).padStart(2,"0")}</b> / ${String(s.qs.length).padStart(2,"0")}</div>
      </div>
      <div class="qcard" id="qcard">
        <div class="qmeta">
          <span class="accent">${esc(typeLabel)}</span>
          ${sourceLine?`<span>${esc(sourceLine)}</span>`:""}
          ${q.page?`<span>第 ${q.page} 页</span>`:""}
          ${isWrong?`<span class="tag" style="color:var(--accent);border-color:var(--accent)">错过</span>`:""}
        </div>
        <div class="stem ${q.stem&&q.stem.length>180?"small":""}">${esc(q.stem)}</div>
        ${opts?`<div class="options">${opts}</div>`:""}
        ${inputBox}
        ${judge}
        ${showAnswer}
      </div>
      <div class="qactions">
        <div class="side">
          <button class="icon-btn ${isMarked?"on":""}" data-act="mark">${isMarked?"★ 已收藏":"☆ 收藏"}</button>
          <button class="icon-btn" data-act="mark-wrong">记为错题</button>
        </div>
        <div class="side main">
          <button class="btn ghost small" data-act="prev" ${s.idx===0?"disabled":""}>上一题</button>
          <button class="btn accent" data-act="reveal" ${revealed?"style=\"display:none\"":""}>显示答案</button>
          <button class="btn" data-act="next">${s.idx===s.qs.length-1?"完成":"下一题"}</button>
        </div>
      </div>
    </section>`;
    wireQuiz();
  }

  function wireQuiz(){
    $$("[data-act='back-library']").forEach(b=>b.onclick=()=>{state.session=null;setNav("library")});
    $$("[data-opt]").forEach(b=>b.onclick=()=>{
      const s=state.session;
      if(!s||isRevealed()) return;
      const q=s.qs[s.idx];
      s.picks[q.id]=b.dataset.opt;
      const ans=(q.answer||"").trim();
      if(/^[A-D]$/.test(ans)){recordJudge(s.picks[q.id]===ans);render();return}
      $$("[data-opt]").forEach(x=>x.classList.toggle("picked",x.dataset.opt===s.picks[q.id]));
    });
    $$("[data-act='check']").forEach(b=>b.onclick=()=>{
      const s=state.session;const q=s.qs[s.idx];
      const el=$("[data-input]");
      const val=el?el.value:"";
      if(!val.trim()){toast("先写答案再提交");return}
      s.inputs[q.id]=val;
      recordJudge(sameAnswer(val,q.answer||""));
      render();
    });
    $$("[data-act='self-right']").forEach(b=>b.onclick=()=>{
      const s=state.session;const q=s.qs[s.idx];const p=prog(s.bank.id);
      if(s.status[q.id]==="wrong"){
        s.status[q.id]="right";
        s.right++;s.wrongN=Math.max(0,s.wrongN-1);
        p.wrong=p.wrong.filter(x=>x!==q.id);
        saveProg();
      }
      render();
    });
    $$("[data-act='reveal']").forEach(b=>b.onclick=reveal);
    $$("[data-act='hide-answer']").forEach(b=>{
      b.onclick=()=>{
        const s=state.session;const q=s.qs[s.idx];
        if(!s.status[q.id]) delete s.peeks[q.id];
        render();
      };
    });
    $$("[data-act='prev']").forEach(b=>b.onclick=prev);
    $$("[data-act='next']").forEach(b=>b.onclick=next);
    $$("[data-act='mark']").forEach(b=>b.onclick=()=>{
      const s=state.session;const q=s.qs[s.idx];const p=prog(s.bank.id);
      if(p.marked.includes(q.id)) p.marked=p.marked.filter(x=>x!==q.id);
      else p.marked.push(q.id);
      saveProg();renderQuiz();toast(p.marked.includes(q.id)?"已收藏":"取消收藏");
    });
    $$("[data-act='mark-wrong']").forEach(b=>b.onclick=()=>{
      const s=state.session;const q=s.qs[s.idx];const p=prog(s.bank.id);
      if(!p.wrong.includes(q.id)) p.wrong.push(q.id);
      saveProg();toast("已记进错题本");renderQuiz();
    });
    const card=$("#qcard");
    let sx=0,sy=0;
    card.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
    card.addEventListener("touchend",e=>{
      const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.abs(dx)>60&&Math.abs(dy)<40){dx<0?next():prev()}
    },{passive:true});
  }

  function isRevealed(){
    const s=state.session;
    if(!s) return false;
    const q=s.qs[s.idx];
    return !!(s.status[q.id]||s.peeks[q.id]);
  }

  function recordJudge(ok){
    const s=state.session;
    const q=s.qs[s.idx];
    const p=prog(s.bank.id);
    s.status[q.id]=ok?"right":"wrong";
    if(ok) s.right++; else s.wrongN++;
    if(!p.seen.includes(q.id)) p.seen.push(q.id);
    if(!ok&&!p.wrong.includes(q.id)) p.wrong.push(q.id);
    saveProg();
  }

  // 判分口径：忽略空格、大小写、全角/半角差别；纯数字或分数答案按数值比较
  function normAns(t){
    return String(t||"")
      .toLowerCase()
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))
      .replace(/（/g,"(").replace(/）/g,")")
      .replace(/／/g,"/").replace(/＝/g,"=").replace(/＋/g,"+").replace(/[－—]/g,"-")
      .replace(/[×·]/g,"*")
      .replace(/[，、]/g,",")
      .replace(/[。；;]/g,"")
      .replace(/[ \t\r\n]/g,"");
  }

  function toNum(v){
    const t=normAns(v);
    if(/^[+-]?\d+(?:\.\d+)?$/.test(t)) return parseFloat(t);
    const m=t.match(/^[+-]?(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if(m&&parseFloat(m[2])!==0) return parseFloat(m[1])/parseFloat(m[2]);
    return null;
  }

  function sameAnswer(user,ans){
    const a=normAns(user), b=normAns(ans);
    if(!a) return false;
    if(a===b) return true;
    const na=toNum(a), nb=toNum(b);
    if(na!==null&&nb!==null) return Math.abs(na-nb)<1e-9*Math.max(1,Math.abs(nb));
    return false;
  }

  function reveal(){
    const s=state.session;
    if(!s||isRevealed()) return;
    const q=s.qs[s.idx];
    s.peeks[q.id]=1;
    const p=prog(s.bank.id);
    if(!p.seen.includes(q.id)) p.seen.push(q.id);
    saveProg();render();
  }
  function next(){
    const s=state.session;
    if(!s) return;
    if(s.idx>=s.qs.length-1){s.finished=true;const p=prog(s.bank.id);p.last=0;saveProg();render();return}
    s.idx++;const p=prog(s.bank.id);p.last=s.idx;saveProg();render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function prev(){
    const s=state.session;
    if(!s||s.idx===0) return;
    s.idx--;const p=prog(s.bank.id);p.last=s.idx;saveProg();render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderFinish(){
    const s=state.session;const p=prog(s.bank.id);
    const wrong=s.qs.filter(q=>p.wrong.includes(q.id)).length;
    const seen=s.qs.filter(q=>p.seen.includes(q.id)).length;
    const marked=s.qs.filter(q=>p.marked.includes(q.id)).length;
    $("#app").innerHTML=`<section class="finish">
      <div class="kicker">Session complete</div>
      <div class="big">这一轮结束了。</div>
      <div class="sub">${esc(s.bank.title)} · ${s.qs.length} 题</div>
      <div class="grid">
        <div><b>${s.right}</b><span>答对</span></div>
        <div><b>${s.wrongN}</b><span>答错</span></div>
        <div><b>${marked}</b><span>收藏</span></div>
      </div>
      <div class="toolbar" style="justify-content:center">
        ${wrong?`<button class="btn accent" data-act="redo-wrong">只练错题</button>`:""}
        <button class="btn" data-act="redo">重新开始</button>
        <button class="btn ghost" data-act="finish-back">回题库</button>
      </div>
    </section>`;
    $$("[data-act='redo']").forEach(b=>b.onclick=()=>startQuiz(s.bank,s.qs));
    $$("[data-act='redo-wrong']").forEach(b=>b.onclick=()=>{
      const qs=s.bank.questions.filter(q=>p.wrong.includes(q.id));
      if(!qs.length){toast("错题本是空的");return}
      startQuiz(s.bank,qs);
    });
    $$("[data-act='finish-back']").forEach(b=>b.onclick=()=>{state.session=null;setNav("library")});
  }

  // keyboard
  document.addEventListener("keydown",e=>{
    if(state.view!=="quiz"||!state.session||state.session.finished) return;
    if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
    if(e.key==="ArrowRight"){e.preventDefault();next()}
    else if(e.key==="ArrowLeft"){e.preventDefault();prev()}
    else if(e.key===" "){e.preventDefault();isRevealed()?next():reveal()}
  });

  // ---------------------------------------------------------------- text helpers
  function normalizeText(t){
    return String(t||"")
      .replace(/\r/g,"")
      .replace(/\u00a0/g," ")
      .replace(/[\u2018\u2019]/g,"'")
      .replace(/[\u201c\u201d]/g,'"')
      .replace(/[ \t]{2,}/g," ")
      .split("\n").map(l=>l.trim()).join("\n");
  }

  const OPT_LINE=/^([A-Ha-h])[\.、．)）]\s*(?=\S)/;
  const OPT_PAREN=/^[（(]([A-HＡ-Ｈ])[）)]\s*(?=\S)/;

  function detectOptions(lines){
    const out=[];
    const keep=[];
    for(let i=0;i<lines.length;i++){
      const l=lines[i];
      let m=l.match(OPT_LINE)||l.match(OPT_PAREN);
      if(m){
        const key=m[1].toUpperCase();
        const text=l.slice(m[0].length).trim();
        if(text.length>0&&text.length<260){
          const last=out[out.length-1];
          if(!last||last.key!==key) out.push({key,text});
          else last.text+=" "+text;
          continue;
        }
      }
      keep.push(l);
    }
    if(out.length>=2&&new Set(out.map(o=>o.key)).size>=2){
      // also support inline （A）...（B）...
      return {options:out,stem:keep.join("\n")};
    }
    // inline full-width options
    const inline=[];
    const txt=keep.join("\n");
    const re=/（([A-D])）([^（]{1,400}?)(?=（[A-D]）|$)/g;
    let mm;
    while((mm=re.exec(txt))) inline.push({key:mm[1],text:mm[2].trim()});
    if(inline.length>=2){
      return {options:inline,stem:txt.replace(re,"").trim()};
    }
    return {options:[],stem:keep.join("\n")};
  }

  function parseQuestions(raw,meta={}){
    const text=normalizeText(raw);
    const lines=text.split("\n");
    const qs=[];
    let chapter=meta.chapter||"";
    let page=null;
    let lastNum=0;
    let section="";
    const startRe=/^(\d{1,3})[.、．)）](?!\d)\s*(?=\S)/;
    const cnRe=/^第\s*(\d{1,3})\s*题\s*[.、：:]?\s*(?=\S)/;
    const enRe=/^(?:Q|Question)\s*(\d{1,3})[.、:：]\s*(?=\S)/i;
    const headRe=/^(第[一二三四五六七八九十百]+[章节部分]|Chapter\s+\d+|Exercises?\s+\d+(\.\d+)?|练习\s*\d+(\.\d+)?|单元\s*\d+)/i;
    const secRe=/^[一二三四五六七八九十]+[、.]\s*\S+/;

    const starts=[];
    for(let i=0;i<lines.length;i++){
      const l=lines[i];
      if(!l) continue;
      const pg=l.match(/^\[\[PAGE (\d+)\]\]$/);
      if(pg){page=+pg[1];continue}
      if(headRe.test(l)||secRe.test(l)){
        if(secRe.test(l)&&l.length<40) section=l.trim();
        else chapter=l.trim();
        continue;
      }
      let m=l.match(startRe)||l.match(cnRe)||l.match(enRe);
      let num=null,body=l;
      if(m){
        num=+m[1];
        body=l.slice(m[0].length);
      }else if(/^\d{1,3}$/.test(l)){
        const nxt=lines.slice(i+1,i+4).find(x=>x.trim());
        if(nxt&&nxt.length>18&&(num=+l, num<=320)&&(lastNum===0||num<=lastNum+8)){
          body="";
        }else{num=null}
      }
      if(num==null) continue;
      if(num>320) continue;
      if(num<lastNum&&lastNum>8&&num<=3){lastNum=0;section=section||""}
      starts.push({i,num,body,page,chapter,section});
      lastNum=Math.max(lastNum,num);
    }

    for(let k=0;k<starts.length;k++){
      const st=starts[k];
      const end=starts[k+1]?starts[k+1].i:lines.length;
      let block=[st.body].filter(Boolean);
      for(let i=st.i+1;i<end;i++){
        const l=lines[i];
        if(/^\[\[PAGE \d+\]\]$/.test(l)) continue;
        if(l) block.push(l);
      }
      // collect page marker inside block
      let qpage=st.page;
      for(let i=st.i;i<end;i++){
        const mm=lines[i].match(/^\[\[PAGE (\d+)\]\]$/);
        if(mm) qpage=+mm[1];
      }
      let body=block.join("\n").trim();
      if(body.length<6) continue;

      // split answer
      let stem=body,answer="",expl="";
      const ansRe=/(?:^|\n)\s*(?:【\s*参考答案\s*】|参考答案|答案|Answer|Answer\s*Key)\s*[：:]?\s*/i;
      const am=body.match(ansRe);
      if(am){
        stem=body.slice(0,am.index).trim();
        const rest=body.slice(am.index+am[0].length).trim();
        const em=rest.match(/(?:^|\n)\s*(?:解析|详解|解答|Explanation)\s*[：:]?\s*/i);
        if(em){answer=rest.slice(0,em.index).trim();expl=rest.slice(em.index+em[0].length).trim()}
        else answer=rest;
      }

      const det=detectOptions(stem.split("\n"));
      if(det.options.length) stem=det.stem.trim();
      if(stem.length<4) continue;
      if(/^(?:答案|解析|详解)[：:]?$/.test(stem)) continue;

      let type="short";
      if(det.options.length>=2) type="choice";
      else if(/^(?:对|错|正确|错误|√|×|T|F|true|false)$/i.test(answer.trim())||/判断/.test(stem)) type="judge";
      else if(/_{2,}|（\s*）|\(\s*\)/.test(stem)) type="fill";
      if(answer&&/^[A-D]$/.test(answer.trim())&&det.options.length>=2) type="choice";

      const sectionLabel=[st.chapter,st.section].filter(Boolean).join(" ");
      qs.push({
        id:uid("p"),
        stem:stem.replace(/[ \t]+/g," ").trim(),
        options:det.options,
        answer:answer.trim(),
        explanation:expl.trim(),
        type,
        chapter:st.chapter||"未分章",
        section:st.section||"",
        source:meta.source||"",
        page:qpage||null,
        _label:sectionLabel
      });
    }
    // dedupe
    const seen=new Set();
    return qs.filter(q=>{
      const key=q.stem.replace(/\s+/g,"").slice(0,120);
      if(!key||seen.has(key)) return false;
      seen.add(key);return true;
    }).slice(0,3000);
  }

  async function handleFiles(files){
    const im=state.import;
    im.busy=true;im.progress=0;im.stage="准备读取";
    const err=$("#importError");if(err)err.innerHTML="";
    const progBox=$("#importProgress");if(progBox)progBox.style.display="flex";
    try{
      const all=[];
      let firstName="";
      for(const f of files){
        firstName=firstName||f.name.replace(/\.[^.]+$/,"");
        setProgress(im.progress,`读取 ${f.name}`);
        if(f.name.toLowerCase().endsWith(".pdf")){
          const qs=await importPDF(f,im);
          all.push(...qs.map(q=>({...q,source:f.name})));
        }else if(f.name.toLowerCase().endsWith(".docx")){
          const qs=await importDOCX(f);
          all.push(...qs.map(q=>({...q,source:f.name})));
        }else if(f.name.toLowerCase().endsWith(".doc")){
          throw new Error("旧版 .doc 读不了，先用 Word 另存为 .docx");
        }else{
          throw new Error("只支持 PDF 和 Word（.docx）");
        }
        setProgress(100,`${f.name} 完成`);
      }
      if(!all.length){
        err.innerHTML=`<div class="notice">没有切出题目。常见原因：这份 PDF 是扫描图片、题目没有编号，或者编号在图片里。换有文字层的版本，或者把题目整理成 Word 再导入。</div>`;
      }else{
        im.parsed=all;
        im.selected=new Set(all.map((_,i)=>i));
        im.title=firstName||"未命名题库";
        im.parsedFileName=firstName;
        toast(`切出 ${all.length} 题`);
      }
    }catch(e){
      err.innerHTML=`<div class="notice">${esc(e.message||"读取失败")}</div>`;
    }finally{
      im.busy=false;
      setTimeout(()=>{const pb=$("#importProgress");if(pb)pb.style.display="none"},600);
      renderImport();
    }
  }

  function setProgress(p,stage){
    state.import.progress=p;state.import.stage=stage;
    const bar=$("#progressBar"),pct=$("#progressPct"),st=$("#stageText");
    if(bar)bar.style.width=p+"%";if(pct)pct.textContent=Math.round(p)+"%";if(st)st.textContent=stage;

  async function importPDF(file,im){
    if(!window.pdfjsLib) throw new Error("PDF 组件没加载，刷新试试");
    if(location.protocol==="file:") throw new Error("本地直接打开时浏览器不让读 PDF。用 GitHub Pages 的网址打开，或者只导入 Word。");
    pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";
    const buf=await file.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:buf}).promise;
    let text="";
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p);
      const content=await page.getTextContent();
      text+=`\n[[PAGE ${p}]]\n`+rebuildPageText(content.items)+"\n";
      setProgress(Math.round(p/doc.numPages*100),`解析 ${file.name} · ${p}/${doc.numPages} 页`);
      if(p%3===0) await new Promise(r=>setTimeout(r,0));
    }
    return parseQuestions(text,{source:file.name});
  }

  function rebuildPageText(items){
    const rows=new Map();
    items.forEach(it=>{
      const s=it.str;
      if(!s||!s.trim()) return;
      const tr=it.transform||[0,0,0,0,0,0];
      const y=Math.round(tr[5]*2)/2;
      const x=tr[4];
      if(!rows.has(y)) rows.set(y,[]);
      rows.get(y).push({x,s});
    });
    const ys=Array.from(rows.keys()).sort((a,b)=>b-a);
    const lines=[];
    for(const y of ys){
      const arr=rows.get(y).sort((a,b)=>a.x-b.x);
      let line="",lastX=null;
      for(const it of arr){
        if(lastX!=null&&it.x-lastX>36&&!/\s$/.test(line)) line+="\t";
        line+=it.s;lastX=it.x+it.s.length*3;
      }
      const t=line.replace(/[\t ]+/g," ").trim();
      if(t) lines.push(t);
    }
    return lines.join("\n");
  }

  async function importDOCX(file){
    if(!window.JSZip) throw new Error("Word 组件没加载，刷新试试");
    const zip=await JSZip.loadAsync(file);
    const entry=zip.file("word/document.xml");
    if(!entry) throw new Error("这个 .docx 里没有正文");
    const xml=await entry.async("string");
    const dom=new DOMParser().parseFromString(xml,"application/xml");
    const paras=Array.from(dom.getElementsByTagNameNS("*","p")).filter(p=>String(p.namespaceURI||"").includes("wordprocessingml"));
    const lines=[];
    paras.forEach(p=>{
      let s="";
      const walk=node=>{
        for(const child of Array.from(node.childNodes)){
          if(child.nodeType===1){
            const ln=child.localName;
            if(ln==="t") s+=child.textContent;
            else if(ln==="tab") s+="\t";
            else if(ln==="br"||ln==="cr") s+="\n";
            else walk(child);
          }
        }
      };
      walk(p);
      s=s.replace(/\u00a0/g," ").trim();
      if(s) lines.push(s);
    });
    return parseQuestions(lines.join("\n"),{source:file.name});
  }

  async function saveImported(publish){
    const im=state.import;
    if(!im.selected.size) return toast("至少选一道题");
    const title=$("#bankTitle")?$("#bankTitle").value.trim():im.title;
    const subject=$("#bankSubject")?$("#bankSubject").value:im.subject;
    if(!title) return toast("给题库起个名字");
    const qs=Array.from(im.selected).sort((a,b)=>a-b).map(i=>{
      const q={...im.parsed[i]};delete q._label;return q;
    });
    const bank={
      id:"user-"+Date.now().toString(36),
      title,subject,
      source:im.parsedFileName||"本地导入",
      description:`从 ${im.parsedFileName||"本地文件"} 导入，共 ${qs.length} 题。`,
      visibility:publish?"public":"private",
      createdAt:new Date().toISOString().slice(0,10),
      count:qs.length,
      questions:qs
    };
    if(publish){
      if(!settings.token){toast("先在设置里填 GitHub token");setNav("settings");return}
      try{
        setProgress(60,"正在写入仓库");
        await publishBank(bank);
        state.manifest=[];loadPublic();
      }catch(e){toast("发布失败："+(e.message||"检查 token 权限"));return}
    }
    await bankPut(bank);
    state.privates=await bankAll();
    state.import.parsed=[];state.import.selected.clear();
    state.tab="private";
    setNav("library");
    toast(publish?"已保存并发布到公共题库":"已保存到私人题库");
  }

  // ---------------------------------------------------------------- publish / settings
  function ghHeaders(token){
    return {Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"};
  }
  function utf8b64(s){
    const bytes=new TextEncoder().encode(s);
    let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
    return btoa(bin);
  }
  function utf8FromB64(b64){
    const bin=atob(String(b64||"").replace(/\s/g,""));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  async function publishBank(bank){
    const [owner,repo]=settings.repo.split("/");
    if(!owner||!repo) throw new Error("仓库地址要写成 owner/repo");
    const path="banks/"+bank.id+".json";
    const api=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const get=await fetch(api,{headers:ghHeaders(settings.token)});
    let sha=null;
    if(get.ok){const j=await get.json();sha=j.sha}
    const body={message:`add bank: ${bank.title}`,content:utf8b64(JSON.stringify(bank))};
    if(sha) body.sha=sha;
    const put=await fetch(api,{method:"PUT",headers:ghHeaders(settings.token),body:JSON.stringify(body)});
    if(!put.ok){
      const t=await put.text();
      throw new Error(put.status===401?"token 无效":put.status===403?"token 没有这个仓库的写入权限":put.status===404?"仓库或分支不存在":t.slice(0,80));
    }
    // 同步更新清单，题库才会出现在公共列表
    const mpath="banks/manifest.json";
    const mget=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${mpath}`,{headers:ghHeaders(settings.token)});
    let manifest={banks:[]},msha=null;
    if(mget.ok){
      const j=await mget.json();msha=j.sha;
      try{manifest=JSON.parse(utf8FromB64(j.content))}catch(e){manifest={banks:[]}}
    }
    if(!Array.isArray(manifest.banks)) manifest.banks=[];
    const entry={id:bank.id,title:bank.title,subject:bank.subject||"",source:bank.source||"",description:bank.description||"",createdAt:new Date().toISOString().slice(0,10),count:bank.questions.length,file:path};
    const i=manifest.banks.findIndex(b=>b.id===bank.id);
    if(i>=0) manifest.banks[i]=entry; else manifest.banks.push(entry);
    const mput=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${mpath}`,{
      method:"PUT",headers:ghHeaders(settings.token),
      body:JSON.stringify({message:`update manifest: ${bank.title}`,content:utf8b64(JSON.stringify(manifest,null,1)),sha:msha})
    });
    if(!mput.ok) throw new Error("题库已推送，但清单更新失败，检查 token 权限后重试");
  }

  async function submitPublic(){
    const bank=state.tab==="public"?null:state.privates[0];
    let json="";
    if(bank){
      json=JSON.stringify(bank);
      try{await navigator.clipboard.writeText(json);toast("题库 JSON 已复制")}catch(e){toast("复制失败，请从题库导出")}
    }
    const url=`https://github.com/${settings.repo}/issues/new?template=bank.yml`;
    window.open(url,"_blank");
    if(!bank) toast("先导出一份题库 JSON，再粘到表单里");
  }

  function renderSettings(){
    $("#app").innerHTML=`
      <div class="section-head" style="margin-top:34px">
        <div><div class="kicker">Settings</div><h2>设置</h2></div>
      </div>
      <div class="settings-block">
        <h3>公共题库仓库</h3>
        <p>默认指向自己的仓库。填一个 GitHub token 才能把题库推进去；只读公开题库不需要 token。</p>
        <div class="inline-form">
          <input id="repoInput" value="${esc(settings.repo)}" placeholder="owner/repo" spellcheck="false">
          <input id="tokenInput" value="${esc(settings.token)}" placeholder="ghp_... 或 fine-grained token" spellcheck="false" type="password">
          <button class="btn" id="saveSettings">保存</button>
        </div>
        <div class="hint" style="margin-top:10px">token 只存在这台设备的 localStorage。建议用 fine-grained token，只给这一个仓库的 Contents 写权限。</div>
      </div>
      <div class="settings-block">
        <h3>公共题库怎么提交</h3>
        <p>有仓库写权限的人，在上面填 token 就能直接发布，题库和清单会一起更新。没有写权限的人，把 JSON 贴进 Issue 表单，由维护者合并。</p>
        <div class="toolbar">
          <a class="btn ghost" href="https://github.com/${esc(settings.repo)}/issues/new?template=bank.yml" target="_blank" rel="noopener">打开提交表单</a>
          <button class="btn ghost" id="copyExport">导出一份私人题库</button>
        </div>
      </div>
      <div class="settings-block">
        <h3>这台设备上的数据</h3>
        <p>私人题库、练习进度、错题本都只在这里。换设备不会自动同步。</p>
        <div class="toolbar">
          <button class="btn ghost" id="exportAll">导出全部私人题库</button>
          <button class="btn ghost" id="clearProgress">清空练习进度</button>
          <button class="btn ghost" id="clearAll" style="border-color:var(--accent);color:var(--accent)">删除全部私人题库</button>
        </div>
      </div>
      <div class="settings-block">
        <div class="hint">拆题 · 单页应用 · 无后端 · 题库与进度都在浏览器里</div>
      </div>`;
    $("#saveSettings").onclick=()=>{
      settings.repo=$("#repoInput").value.trim()||"Jiang2588/chati";
      settings.token=$("#tokenInput").value.trim();
      writeJSON(SET_KEY,settings);
      $("#repoMini").textContent=settings.repo;
      toast("已保存");
    };
    $("#copyExport").onclick=async()=>{
      const b=state.privates[0];
      if(!b) return toast("还没有私人题库");
      const txt=JSON.stringify(b);
      try{await navigator.clipboard.writeText(txt);toast("已复制，去表单粘贴")}catch(e){download(b.title+".json",txt)}
    };
    $("#exportAll").onclick=()=>{
      if(!state.privates.length) return toast("还没有私人题库");
      download("chati-banks.json",JSON.stringify(state.privates));
    };
    $("#clearProgress").onclick=()=>{
      if(!confirm("清空所有练习进度和错题本？题库不动。"))return;
      progress={};saveProg();render();toast("进度已清空");
    };
    $("#clearAll").onclick=async()=>{
      if(!confirm("删除全部私人题库？这个动作不能恢复。"))return;
      for(const b of state.privates) await bankDel(b.id);
      state.privates=[];render();toast("已删除");
    };
  }

  function download(name,text){
    const blob=new Blob([text],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name.endsWith(".json")?name:name+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  // ---------------------------------------------------------------- render root
  async function render(){
    if(state.loading){
      $("#app").innerHTML=`<div class="empty"><div class="big">正在整理题目</div><p>公共题库和私人题库都读一下。</p></div>`;
      return;
    }
    document.body.classList.toggle("focus",state.view==="quiz");
    if(state.view==="library") renderLibrary();
    else if(state.view==="import") renderImport();
    else if(state.view==="settings") renderSettings();
    else if(state.view==="quiz") renderQuiz();
  }

  async function boot(){
    await loadPublic();
    state.privates=await bankAll();
    state.loading=false;
    $("#repoMini").textContent=settings.repo;
    render();
  }

  boot();
})();
</script>
